[workspace]
resolver = "3"
members = ["crates/magpie-core", "crates/magpie-android"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/1527183723/magpie-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
    "io-util",
    "signal",
] }
axum = { version = "0.8", features = ["json", "query", "macros"] }
# reqwest 0.13 defaults to aws-lc-rs for TLS, which needs CMake + NASM to build.
# Neither is a reasonable thing to require from someone who just wants an APK,
# so the provider is chosen here instead: rustls with `ring`, which builds with
# nothing but a C compiler — the NDK's clang on Android, MSVC on Windows.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
futures-util = "0.3"
bytes = "1"
http = "1"
jni = "0.21"

# The APK ships one shared library per ABI; size matters more than peak speed.
# `panic = "abort"` is deliberately NOT set: every JNI entry point wraps its body
# in `catch_unwind`, and aborting would turn a recoverable bug in one request
# into a dead gateway.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
incremental = false

[profile.dev]
incremental = true
